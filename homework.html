<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Assignments</title>
    <style>
        body, html {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
        }
        .container {
            width: 90%;
            max-width: 700px;
            padding: 40px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            text-align: center;
        }
        .question {
            display: none;
        }
        .active {
            display: block;
        }
        .button {
            margin: 20px 10px;
            padding: 15px 30px;
            font-size: 1em;
            color: white;
            background-color: #1e94c2;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }
        .button:hover {
            background-color: #166b8e;
        }
        .selected {
            background-color: #1177aa;
            transform: scale(1.05);
        }
        .progress {
            margin-top: 20px;
            font-size: 1em;
            color: #666;
            display: none;
        }
        .next-button {
            margin-top: 30px;
            display: none;
        }
        #emailInput {
            margin-top: 20px;
            padding: 10px;
            font-size: 1em;
            width: 80%;
        }
        #submitButton[disabled] {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Homework Assignments</h1>
        <p id="firmwareInfo" style="display: none;">
            <strong>Firmware Version:</strong> <span id="firmwareVersion"></span>
        </p>

        <form id="homeworkForm">
            <div class="question active" id="q1">
                <p>Are you using an ARC or a NARC?</p>
                <button type="button" class="button" onclick="nextQuestion('ARC')">ARC</button>
                <button type="button" class="button" onclick="nextQuestion('NARC')">NARC</button>
            </div>

            <div class="question" id="submitPage">
                <p>Thank you for completing the questions!</p>
                <input type="email" id="emailInput" placeholder="Enter your email" oninput="validateEmail()">
                <button type="submit" class="button" id="submitButton" disabled>Submit Responses</button>
            </div>

            <div class="progress" id="progress">Question 1 of 3</div>
            <button type="button" class="button" id="prevButton" onclick="prevQuestion()" style="display: none;">Previous</button>
        </form>
        
        <script>
            let responses = {};
            let currentIndex = 0;
            let currentPath = [];
            let deviceType = '';

            const questionsText = {
                arc1: 'Enable low brightness mode. Is the LED brightness acceptable?',
                arc2: 'Verify the protection LED. Is it working without delays?',
                arc3: 'Did the amp unmute successfully when the volume up or down button was pressed?',
                arc4: 'Did the TV remain muted after 30 seconds of activating the mute command?',
                arc5: 'Was the remote successfully programmed to control the amp's power ON/OFF?',
                arc6: 'Did the amp switch inputs correctly when testing the dual-source switchover?',
                arc7: 'Were there any issues observed during rapid DSP EQ frequency adjustments?',
                arc8: 'Did the amp reset to factory defaults successfully?'
            };

            const firmwareVersions = { ARC: '1.59', NARC: '1.58b' };
            
            function nextQuestion(device) {
                deviceType = device;
                document.getElementById('firmwareVersion').textContent = firmwareVersions[device];
                document.getElementById('firmwareInfo').style.display = 'block';
                document.getElementById('q1').classList.remove('active');
                currentPath = Object.keys(questionsText);
                currentIndex = 0;
                loadQuestion();
                document.getElementById('prevButton').style.display = 'inline-block';
                updateProgress();
            }

            function loadQuestion() {
                document.querySelectorAll('.question').forEach(q => q.classList.remove('active'));
                document.getElementById(currentPath[currentIndex]).classList.add('active');
            }

            function validateEmail() {
                const email = document.getElementById('emailInput').value;
                const submitButton = document.getElementById('submitButton');
                const isValid = email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/);
                submitButton.disabled = !isValid;
            }

            document.getElementById('homeworkForm').onsubmit = async function(e) {
                e.preventDefault();
                responses['deviceType'] = deviceType;
                responses['email'] = document.getElementById('emailInput').value;
                
                let emailBody = 'Homework Submission\n';
                Object.keys(responses).forEach(key => {
                    const questionText = questionsText[key] || key;
                    emailBody += `${questionText}\nAnswer: ${responses[key]}\n`;
                });
                
                try {
                    const response = await fetch('/submit-homework', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ responses, emailBody })
                    });
                    if (response.ok) {
                        window.location.href = '/thank-you.html';
                    } else {
                        alert('Submission failed.');
                    }
                } catch (error) {
                    alert('Error submitting.');
                }
            };
        </script>
    </div>
</body>
</html>
